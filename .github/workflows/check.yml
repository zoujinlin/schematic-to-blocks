name: Check skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install rendering tools and fonts
        timeout-minutes: 4
        run: sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 && sudo apt-get install -y fonts-wqy-zenhei fonts-dejavu-core poppler-utils
      - run: python -m pip install -r skills/schematic-hardware-diagrams/requirements.txt
      - run: npm ci --ignore-scripts
      - name: Install layout test browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Run tests with actionable annotations
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('skills/schematic-hardware-diagrams/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, message in result.errors + result.failures:
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={test.id()}::{message}')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - run: python skills/schematic-hardware-diagrams/scripts/schematic.py doctor --json
      - run: python skills/schematic-hardware-diagrams/scripts/schematic.py deliver skills/schematic-hardware-diagrams/assets/example.en.json --out output/example --formats html,svg,pdf,drawio,png --json
      - name: Check responsive viewer layout
        run: npm run test:layout
      - name: Save browser layout screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-layout-review
          path: output/layout-review/
          if-no-files-found: ignore
          retention-days: 14
